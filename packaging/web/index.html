<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>The AllCraft Ani</title>
    <link rel="icon" href="anicraft.png">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #131316; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #anicraft_loading {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 2em; text-align: center; color: #b0b0b8; font: 14px/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="anicraft_canvas"></canvas>
    <div id="anicraft_loading">
      <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ececef">Loading The AllCraft Ani&hellip;</div>
      <div style="width:240px;height:5px;background:#323238;border-radius:999px;overflow:hidden">
        <div id="an_load_bar" style="width:2%;height:100%;background:#c084fc;border-radius:999px;transition:width 0.12s ease-out"></div>
      </div>
      <div id="an_load_pct" style="margin-top:8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums">Starting&hellip;</div>
    </div>
    <noscript>The AllCraft Ani needs JavaScript and WebAssembly.</noscript>
    <script type="module">
      import init from "./anicraft.js";
      init().catch((e) => {
        console.error(e);
        const el = document.getElementById("anicraft_loading");
        if (el) el.textContent = "The AllCraft Ani could not start in this browser: " + e;
      });
    </script>
  </body>
</html>
